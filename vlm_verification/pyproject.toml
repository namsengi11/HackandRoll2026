[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["verification*"]
exclude = ["test_images*"]

[project]
name = "vlm-verification"
version = "0.1.0"
description = "VLM-based verification service (Gemini + optional web retrieval + CLIP ranking) for Hack&Roll."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "supabase>=2.27.2",
  "pillow>=10.2",
  "numpy>=1.26",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.48",
  "google-genai",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "httpx>=0.27",
]